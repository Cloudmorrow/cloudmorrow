<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Five surfaces on the left reach the server through its gate. Inside the server, installed quills sit above a record store that holds every record of every datamodel. The Quill Catalog on the right supplies quills and the datamodels they need at install. Records export in open formats."><style>
text { font-family: Barlow, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #dfe5f0; }
.eyebrow-t text { font-family: 'Barlow Semi Condensed', 'Arial Narrow', 'Segoe UI', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.8px; fill: #99a1b3; }
.fields text { font-family: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 12.5px; }
.rows text { font-family: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 11.5px; }
.t-b { font-weight: 600; font-size: 14px; }
.t-m { font-size: 11.5px; fill: #99a1b3; }
.fields .t-m { font-size: 12.5px; }
.t-f { font-size: 11px; fill: #99a1b3; opacity: .8; }
.t-mono { font-family: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 12px; }
.t-big { font-size: 16px; font-weight: 700; }
.t-sky, tspan.t-sky { fill: #5aa6e0; }
.t-lens, tspan.t-lens { fill: #e0a84c; }
.t-good { fill: #5ce89b; }
.box rect { fill: #272d39; stroke: #333a48; }
.box rect.warm, .ext { fill: #3f3524; stroke: #e0a84c; stroke-width: 1.5; }
.server { fill: #1f242e; stroke: #4a5364; stroke-width: 1.5; }
.gate, .found { fill: #1d3a55; stroke: #5aa6e0; stroke-width: 1.5; }
.panel { fill: #272d39; stroke: #333a48; }
.panel.strong { stroke: #4a5364; stroke-width: 1.5; }
.rows rect { fill: #1f242e; }
.rows rect.warm { stroke: #e0a84c; }
.flow path, .flow line { fill: none; stroke: #dfe5f0; stroke-width: 1.5; }
.lens-line { fill: none; stroke: #e0a84c; stroke-width: 1.5; }
.sky-line { fill: none; stroke: #5aa6e0; stroke-width: 1.5; }
.good-line { fill: none; stroke: #5ce89b; stroke-width: 1.5; }
.rule { stroke: #333a48; }
</style><rect width="1000" height="560" rx="16" fill="#14171f"/>
      <defs>
        <marker id="dr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dfe5f0"/></marker>
        <marker id="dr-arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa6e0"/></marker>
        <marker id="dr-arrow-lens" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a84c"/></marker>
      </defs>
      <g class="eyebrow-t"><text x="40" y="34">SURFACES · FIVE WAYS IN</text><text x="360" y="34">YOUR SERVER · A PI, A LAPTOP, A CONTAINER</text><text x="790" y="34">CLOUDMORROW.COM</text></g>
      <g class="box">
        <rect x="40" y="56" width="200" height="44" rx="10"/><text x="60" y="83" class="t-b">Phone</text><text x="222" y="83" class="t-m" text-anchor="end">WebApp</text>
        <rect x="40" y="116" width="200" height="44" rx="10"/><text x="60" y="143" class="t-b">Browser</text><text x="222" y="143" class="t-m" text-anchor="end">Web</text>
        <rect x="40" y="176" width="200" height="44" rx="10"/><text x="60" y="203" class="t-b">Terminal</text><text x="222" y="203" class="t-m" text-anchor="end">TUI</text>
        <rect x="40" y="236" width="200" height="44" rx="10"/><text x="60" y="263" class="t-b">Command line</text><text x="222" y="263" class="t-m t-mono" text-anchor="end">cm</text>
        <rect x="40" y="296" width="200" height="44" rx="10"/><text x="60" y="323" class="t-b">AI agent</text><text x="222" y="323" class="t-m" text-anchor="end">AI skills</text>
      </g>
      <circle cx="70" cy="420" r="14" class="lens-line"/><path d="M46 462 Q70 436 94 462" class="lens-line"/>
      <text x="104" y="418" class="t-b t-lens">You</text><text x="104" y="436" class="t-m">sign in with a password,</text><text x="104" y="452" class="t-m">never handle a key</text>
      <line x1="140" y1="340" x2="140" y2="396" class="lens-line" stroke-dasharray="3 3"/>
      <g class="flow">
        <path d="M240 78 L300 78 L300 110 L352 110" marker-end="url(#dr-arrow)"/>
        <path d="M240 138 L300 138 L300 110"/><path d="M240 198 L300 198 L300 110"/><path d="M240 258 L300 258 L300 110"/><path d="M240 318 L300 318 L300 110"/>
      </g>
      <text x="300" y="350" class="t-m" text-anchor="middle">HTTPS</text><text x="300" y="364" class="t-m" text-anchor="middle">the record API</text><text x="300" y="378" class="t-m" text-anchor="middle">as you</text>
      <rect x="352" y="48" width="400" height="492" rx="16" class="server"/>
      <rect x="368" y="88" width="368" height="44" rx="10" class="gate"/>
      <text x="384" y="108" class="t-b t-sky">The gate</text>
      <text x="384" y="124" class="t-m">who you are · your circle · what the quill asked for</text>
      <text x="368" y="76" class="t-f">every request enters here</text>
      <text x="368" y="166" class="eyebrow-t">QUILLS INSTALLED · screens, jobs, APIs, AI skills · no UI code</text>
      <g class="box">
        <rect x="368" y="176" width="84" height="36" rx="8"/><text x="410" y="199" class="t-b" text-anchor="middle">Tasks</text>
        <rect x="460" y="176" width="84" height="36" rx="8"/><text x="502" y="199" class="t-b" text-anchor="middle">Calendar</text>
        <rect x="552" y="176" width="84" height="36" rx="8"/><text x="594" y="199" class="t-b" text-anchor="middle">Channels</text>
        <rect x="644" y="176" width="92" height="36" rx="8" class="warm"/><text x="690" y="199" class="t-b t-lens" text-anchor="middle">CRM</text>
      </g>
      <g class="flow">
        <line x1="410" y1="212" x2="410" y2="258" marker-end="url(#dr-arrow)"/><line x1="502" y1="212" x2="502" y2="258" marker-end="url(#dr-arrow)"/><line x1="594" y1="212" x2="594" y2="258" marker-end="url(#dr-arrow)"/>
        <line x1="690" y1="212" x2="690" y2="258" class="lens-line" marker-end="url(#dr-arrow-lens)"/>
      </g>
      <rect x="368" y="260" width="368" height="166" rx="10" class="panel"/>
      <text x="384" y="282" class="t-b">Record store</text><text x="720" y="282" class="t-m" text-anchor="end">one sealed table · encrypted at rest</text>
      <g class="rows">
        <rect x="384" y="296" width="336" height="22" rx="4"/><text x="392" y="311" class="t-sky">task</text><text x="440" y="311">Repot the fig</text><text x="712" y="311" class="t-f" text-anchor="end">jimmi · personal</text>
        <rect x="384" y="322" width="336" height="22" rx="4"/><text x="392" y="337" class="t-sky">event</text><text x="440" y="337">Car service</text><text x="712" y="337" class="t-f" text-anchor="end">family · shared</text>
        <rect x="384" y="348" width="336" height="22" rx="4"/><text x="392" y="363" class="t-sky">message</text><text x="460" y="363">#general: lunch?</text><text x="712" y="363" class="t-f" text-anchor="end">everyone · public</text>
        <rect x="384" y="374" width="336" height="22" rx="4" class="warm"/><text x="392" y="389" class="t-sky">organisation</text><text x="488" y="389">Nordlys Bakery</text><text x="608" y="389" class="t-lens t-b">crm.status</text>
      </g>
      <text x="384" y="414" class="t-m">the envelope: id · owner · scope · rev · written_by · links</text>
      <rect x="368" y="438" width="220" height="86" rx="10" class="panel"/>
      <text x="384" y="460" class="t-b">Datamodels</text><text x="384" y="478" class="t-m">copies of the shapes its quills use:</text><text x="384" y="493" class="t-m">it never needs the registry to run</text>
      <text x="384" y="512" class="t-mono t-sky">task event organisation …</text>
      <rect x="600" y="438" width="136" height="86" rx="10" class="panel"/>
      <text x="616" y="460" class="t-b">Change feed</text><text x="616" y="478" class="t-m">every write bumps</text><text x="616" y="493" class="t-m">a revision; clients,</text><text x="616" y="508" class="t-m">jobs and audit read it</text>
      <rect x="790" y="56" width="180" height="128" rx="12" class="panel"/>
      <text x="806" y="80" class="t-b">Quill Catalog</text><text x="806" y="98" class="t-m">free, open source,</text><text x="806" y="113" class="t-m">a git repo per quill</text>
      <line x1="806" y1="124" x2="954" y2="124" class="rule"/>
      <text x="806" y="146" class="t-b">Datamodel registry</text><text x="806" y="164" class="t-m">the foundational shapes,</text><text x="806" y="178" class="t-m">versioned, immutable</text>
      <path d="M790 120 L770 120 L770 194 L752 194" class="sky-line" marker-end="url(#dr-arrow-sky)"/>
      <text x="782" y="214" class="t-b t-sky">install</text><text x="782" y="228" class="t-m">manifest + the datamodels</text><text x="782" y="242" class="t-m">it uses, after you say yes</text>
      <path d="M736 343 L790 343" class="good-line" marker-end="url(#dr-arrow)"/>
      <text x="798" y="338" class="t-b t-good">export, any time</text><text x="798" y="354" class="t-m">vCard · iCal · Markdown</text><text x="798" y="368" class="t-m">.env · CSV · JSON</text>
      <text x="798" y="386" class="t-m">a whole server to a folder,</text><text x="798" y="400" class="t-m">and back into an empty one</text>
      <text x="798" y="460" class="t-b">Remove a quill</text><text x="798" y="476" class="t-m">its screens go.</text><text x="798" y="490" class="t-m">Its records stay, in the</text><text x="798" y="504" class="t-m">shape every other quill</text><text x="798" y="518" class="t-m">already reads.</text>
    </svg>