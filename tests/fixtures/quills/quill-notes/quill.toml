[quill]
id = "notes"
name = "Notes"
version = "1.2.0"
summary = "Markdown notes in folders, with pictures."
category = "personal"
icon = "notes"
publisher = "Cloudmorrow"
license = "AGPL-3.0-or-later"
code = "quill.py"
features = [
  "Notes in Markdown, in folders, saved as you type",
  "A live editor in the terminal: the line you are on stays Markdown, the rest renders",
  "Pictures pasted, dropped or picked into a note, shown where they are",
  "Search every note, by its name or any line in it",
  "Each note is a plain Markdown file in the Notes folder of your drive: in My Files, on WebDAV, in cm note, and open to any editor",
  "A welcome note for everyone the first time they open Notes",
  "Add a line to the end of a note from anywhere: its sheet, cm notes, or your assistant",
]

[uses]
datamodels = ["note"]

# One tab: your folders and notes beside the page you are writing. On a
# phone the tree comes first and the page after it; on a computer and in
# the terminal they are side by side.
[[screens]]
id = "notes"
kit = "editor"
label = "Notes"
model = "note"
title = "title"
body = "body"
path = "path"                             # folder/sub/title: the folders are the tree

# The first time somebody opens Notes and has none, a note that says how
# the editor works.
[[datasets]]
id = "welcome"
model = "note"
seed = "per-owner"
file = "datasets/welcome.toml"

# A line at the end of a note without opening it: a list, a log, a thought
# from the command line (`cm notes add-to-the-end ideas/garden text="…"`)
# or from your assistant.
[[actions]]
id = "add-to-the-end"
label = "Add to the end"
on = "note"
description = "Adds text on a new line at the end of the note, leaving the rest as it is."
[actions.fields]
text = { kind = "text", required = true }
