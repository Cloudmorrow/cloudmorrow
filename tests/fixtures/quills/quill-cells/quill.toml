# A local copy of Cloudmorrow/quill-cells for the kit's tests: a sheet
# screen over the .cell files in the Documents folder of a drive.
[quill]
id = "cells"
name = "Cells"
version = "2.0.0"
summary = "Small spreadsheets: cells, numbers and formulas, worked out on every surface."
category = "productivity"
icon = "grid"
publisher = "Cloudmorrow"
license = "AGPL-3.0-or-later"

[uses]
datamodels = ["file"]

[[screens]]
id = "sheets"
kit = "sheet"
label = "Cells"
model = "file"
where = { share = "my-files", within = "Documents" }
suffix = [".cell", ".xlsx"]
title = "name"
cells = "text"
path = "path"

[[datasets]]
id = "welcome"
model = "file"
seed = "per-owner"
where = { share = "my-files", within = "Documents", suffix = ".cell,.xlsx" }
file = "datasets/welcome.toml"
