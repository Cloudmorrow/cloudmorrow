[datamodel]
id = "secret"
version = 1
label = "Secret"
description = "A key and its value, in a vault and an environment. Sealed under the server's key; never an assistant's."
domain = "secrets"
scopes = ["personal"]
title = "key"
# Kept in the secrets store `cm secret` has always used, and served as records by the core.
backend = "vaults"

[fields]
vault = { kind = "string", required = true, indexed = true, default = "default", label = "Vault" }
environment = { kind = "string", required = true, indexed = true, default = "local", label = "Environment" }
key = { kind = "string", required = true, indexed = true, label = "Key" }
# Never in a listing: reading one secret is how its value is asked for.
value = { kind = "string", secret = true, label = "Value" }
length = { kind = "int", indexed = true, label = "Length" }
