# The domains: foundational datamodels that belong together, chosen together at install.

[[domains]]
id = "tasks"
label = "Tasks"
description = "Boards and the tasks on them."
datamodels = ["board", "task"]

[[domains]]
id = "crm"
label = "Customers (CRM)"
description = "The organisations and people you deal with, the deals in your pipeline, and what you do with them — kept in books you share."
datamodels = ["book", "organisation", "contact", "stage", "deal", "activity"]

[[domains]]
id = "fleet"
label = "Fleet"
description = "Cars, vans and bikes: what you drive and keep on the road."
datamodels = ["vehicle"]

[[domains]]
id = "calendars"
label = "Calendars"
description = "Calendars and the events on them."
datamodels = ["calendar", "event"]

[[domains]]
id = "messaging"
label = "Messaging"
description = "Channels and the messages in them."
datamodels = ["channel", "message"]

[[domains]]
id = "secrets"
label = "Secrets"
description = "Keys and passwords in vaults and environments, sealed; never an assistant's."
datamodels = ["secret"]

[[domains]]
id = "files"
label = "Files"
description = "Your own drive, your fileshares, and the files in them."
datamodels = ["share", "file"]
