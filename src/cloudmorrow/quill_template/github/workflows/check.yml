# Every push and pull request: the manifest checks out against the
# foundational datamodels, and every screen binds to fields that exist.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cloudmorrow[tui] @ git+https://github.com/Cloudmorrow/cloudmorrow"
      - run: cm quill check .
