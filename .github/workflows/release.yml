# A release is a tag (scripts/release.py). This makes the tag a GitHub
# Release as well, with two assets:
#
#   install.sh  the client installer for no cloud in particular, run with
#               --server <the cloud> (scripts/release_installer.py)
#   *.whl       the client itself, which that installer installs
#
# At releases/latest/download/<name>, so nobody has to know a version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the tag (hatch-vcs).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: The client installer, pointed at this release's wheel
        run: |
          wheel="$(ls dist/*.whl | head -n 1)"
          python scripts/release_installer.py --tag "$GITHUB_REF_NAME" --wheel "$wheel" --out dist/install.sh
          sh -n dist/install.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made on github.com makes its tag, and the tag starts this:
        # then the release is there already, and only wants its two files.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/install.sh --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/install.sh \
              --title "$GITHUB_REF_NAME" \
              --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")" \
              --verify-tag
          fi
