# Lint and test every pull request, every push to main, and every tag. A
# tag is a release (scripts/release.py), so this is what says the release
# works. A branch is tested through its pull request alone: a push to it
# used to start a second, identical run.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # What the image runs. 3.11, the oldest the installers accept, belongs
        # here too once the suite is known to pass on it.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the nearest tag (hatch-vcs).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[tui,agent,server,dev]"
      # Four workers: the runner has four cores, and the suite is two
      # thousand small tests, a third of them driving the terminal app.
      - run: pytest -q -n 4

  # The same suite on the other engine: every test that opens a database
  # file gets a schema on this server instead (tests/conftest.py). A
  # statement that passes on one engine and not the other fails the build.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudmorrow
          POSTGRES_PASSWORD: cloudmorrow
          POSTGRES_DB: cloudmorrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudmorrow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[tui,agent,server,postgres,dev]"
      - run: pytest -q -n 4
        env:
          CLOUDMORROW_TEST_DATABASE_URL: postgresql://cloudmorrow:cloudmorrow@localhost:5432/cloudmorrow

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t cloudmorrow:ci .
